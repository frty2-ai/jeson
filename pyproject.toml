[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jeson"
version = "0.1.0"
description = "Typed JSON from images in one forward pass: a JSON schema in, valid JSON out, no token decoding."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "The jeson authors" }]
keywords = ["json-schema", "structured-output", "document-ai", "vision-language-model", "information-extraction", "ocr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# The model runtimes. Kept optional so the schema compiler, assembler, lock and scorers install without torch.
models = ["torch>=2.4", "transformers>=5.0", "accelerate>=1.0"]
# Experimental: strings as spans over OCR words.
spans = ["rapidocr>=3.0", "opencv-python-headless>=4.9"]
# Benchmarks: synthetic page generator and the hosted-model comparison.
bench = ["playwright>=1.45", "httpx>=0.27", "anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]
all = ["jeson[models,spans,bench]"]

[project.scripts]
jeson = "jeson.cli:main"

[project.urls]
Documentation = "https://github.com/frty2-ai/jeson/tree/main/docs"
Issues = "https://github.com/frty2-ai/jeson/issues"
Source = "https://github.com/frty2-ai/jeson"

[tool.hatch.build.targets.wheel]
packages = ["src/jeson"]

[tool.ruff]
line-length = 160
target-version = "py310"
src = ["src", "benchmarks", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B905"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/synth_docs.py" = ["E501"]  # inline HTML templates for the rendered pages

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gpu: needs a CUDA GPU and downloads model weights (deselect with -m 'not gpu')"]
